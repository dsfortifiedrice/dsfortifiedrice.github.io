<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3e3b5"/><stop offset="0.6" stop-color="#d9b866"/><stop offset="1" stop-color="#8a6a2e"/></linearGradient>
<linearGradient id="silo" x1="0" x2="1"><stop offset="0" stop-color="#d8dcd0"/><stop offset="0.5" stop-color="#f4f5ee"/><stop offset="1" stop-color="#aeb5a4"/></linearGradient>
<linearGradient id="bld" x1="0" x2="1"><stop offset="0" stop-color="#4e6b4c"/><stop offset="1" stop-color="#2f4a30"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b5226"/><stop offset="1" stop-color="#3e2f14"/></linearGradient>
<g id="grain"><ellipse rx="5" ry="13" fill="#fff6dc" stroke="#d9c38a" stroke-width="1"/></g>
<g id="bag"><rect width="150" height="95" rx="10" fill="#f6ecd0"/><rect y="0" width="150" height="14" rx="7" fill="#e3d3a2"/><rect x="30" y="30" width="90" height="42" rx="6" fill="#4e6b4c"/><text x="75" y="58" font-family="Georgia,serif" font-weight="700" font-size="22" fill="#f6ecd0" text-anchor="middle">DS</text></g>
</defs>
<rect width="800" height="1000" fill="url(#bg)"/>
<circle cx="560" cy="230" r="150" fill="#fff3c9" opacity=".55"/>
<circle cx="560" cy="230" r="95" fill="#fff8e0" opacity=".8"/>
<!-- distant paddy -->
<path d="M0 560 Q200 520 400 550 T800 530 V700 H0Z" fill="#c9a24d" opacity=".7"/>
<!-- silos -->
<g>
<rect x="470" y="300" width="110" height="330" fill="url(#silo)"/><ellipse cx="525" cy="300" rx="55" ry="16" fill="#e9ebe1"/>
<rect x="590" y="350" width="100" height="280" fill="url(#silo)"/><ellipse cx="640" cy="350" rx="50" ry="14" fill="#e9ebe1"/>
<rect x="700" y="400" width="90" height="230" fill="url(#silo)"/><ellipse cx="745" cy="400" rx="45" ry="13" fill="#e9ebe1"/>
<g stroke="#9aa190" stroke-width="3"><path d="M470 400H580M470 480H580M470 560H580M590 440H690M590 520H690M700 480H790M700 560H790"/></g>
</g>
<!-- mill building -->
<polygon points="120,420 330,340 540,420 540,640 120,640" fill="url(#bld)"/>
<polygon points="105,425 330,330 555,425 555,445 330,355 105,445" fill="#2a3f2a"/>
<g fill="#f3e3b5" opacity=".9"><rect x="170" y="480" width="70" height="60" rx="6"/><rect x="295" y="480" width="70" height="60" rx="6"/><rect x="420" y="480" width="70" height="60" rx="6"/></g>
<circle cx="330" cy="400" r="26" fill="#c9a24d"/><text x="330" y="410" font-family="Georgia,serif" font-weight="700" font-size="26" fill="#2a3f2a" text-anchor="middle">DS</text>
<!-- chimney + hopper -->
<rect x="150" y="320" width="34" height="110" fill="#6b4f2a"/>
<!-- conveyor -->
<path d="M330 640 L520 330" stroke="#3a3a36" stroke-width="22" stroke-linecap="round"/>
<path d="M330 640 L520 330" stroke="#8b8b80" stroke-width="10" stroke-linecap="round" stroke-dasharray="4 14"/>
<!-- floor -->
<rect y="640" width="800" height="360" fill="url(#floor)"/>
<rect y="640" width="800" height="14" fill="#c9a24d"/>
<!-- falling grains -->
<g opacity=".95">
<use href="#grain" x="545" y="610" transform="rotate(10 545 610)"/><use href="#grain" x="560" y="650" transform="rotate(-8 560 650)"/><use href="#grain" x="535" y="690" transform="rotate(14 535 690)"/>
</g>
<!-- bags -->
<use href="#bag" x="440" y="720"/><use href="#bag" x="600" y="720"/><use href="#bag" x="520" y="632" transform="translate(0,0)"/>
<use href="#bag" x="600" y="820"/><use href="#bag" x="440" y="820"/>
<!-- rice pile -->
<path d="M60 900 Q230 700 400 900Z" fill="#fff6dc"/>
<g fill="#e3d3a2"><circle cx="200" cy="860" r="5"/><circle cx="240" cy="840" r="5"/><circle cx="170" cy="880" r="5"/><circle cx="280" cy="870" r="5"/><circle cx="230" cy="885" r="5"/></g>
<!-- stalks foreground -->
<g stroke="#8a6a2e" stroke-width="5" fill="none" stroke-linecap="round">
<path d="M40 1000 Q30 900 70 800"/><path d="M90 1000 Q90 900 140 820"/><path d="M740 1000 Q760 920 730 840"/></g>
<g fill="#f0d98b"><ellipse cx="70" cy="800" rx="8" ry="22" transform="rotate(25 70 800)"/><ellipse cx="85" cy="830" rx="8" ry="20" transform="rotate(35 85 830)"/><ellipse cx="140" cy="820" rx="8" ry="22" transform="rotate(30 140 820)"/><ellipse cx="730" cy="840" rx="8" ry="22" transform="rotate(-25 730 840)"/></g>
</svg>
